<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Keyboard dashboard</title>
<link rel="icon" href="https://agentkeyboard.com/favicon.png">
<meta name="description" content="Your own Fly Sprite running Claude Code, editing your app from a prompt bar on the live site. Sign in with GitHub, link Fly, add one script tag.">

<meta property="og:site_name" content="Agent Keyboard">
<meta property="og:title" content="Agent Keyboard Cloud">
<meta property="og:description" content="Your own Fly Sprite running Claude Code, editing your app from a prompt bar on the live site. Sign in with GitHub, link Fly, add one script tag.">
<meta property="og:url" content="https://agentkeyboard.com/start">

</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="https://agentkeyboard.com"><img src="https://agentkeyboard.com/typewriter-mark.png" alt=""><b>Agent Keyboard</b></a><span id="who"></span></div>
  <div class="headrow"><h1>Your sites</h1><span id="acts"></span></div>
  <div id="app" aria-live="polite"><p>Loading…</p></div>
  <div id="clslot" aria-live="polite"></div>
</div>
<script>
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const api = async (path, body) => {
  const r = await fetch("/cloud/" + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Something went wrong (" + r.status + ")");
  return d;
};
const LABEL = { restart: "Restarting…", update: "Updating… (about a minute)", delete: "Deleting…", tag: "Adding…", pages: "Starting…", "domain-remove": "Removing…", "email-remove": "Removing…", email: "Starting…", "import-skip": "Saving…" };
// Spec 19: the site had an older bar. Offer to bring its notes and memory over (the old instance asks its owner to sign in once).
const moved = (i) => {
  const p = i.previous, m = i.migrate ?? {}, host = p && new URL(p.origin).host;
  if (!p) return "";
  if (m.state === "skipped") return `<div class="meta">Started fresh. You can still <a href="/cloud/import/${esc(i.id)}" target="_blank" rel="opener">bring ${esc(host)}'s notes and memory over</a>.</div>`;
  if (m.state === "running") return `<div class="meta">Bringing notes and memory over from ${esc(host)}…</div>`;
  if (m.state === "done") return `<div class="meta">${esc(m.report)}</div>`;
  return `<div class="meta">This site already had Agent Keyboard at <b>${esc(host)}</b>. Bring its notes and memory over? Its bar stays on your site until you choose.</div>${m.state === "error" ? `<p class="err">${esc(m.error)}</p>` : ""}<div class="row"><a class="btn ghost" href="/cloud/import/${esc(i.id)}" target="_blank" rel="opener">Bring them over</a><button class="btn ghost" data-a="import-skip">Start fresh</button></div>`;
};
// The older bar stays on the site until its notes are brought over or skipped; then the tag is swapped.
const held = (i) => i.previous && !["done", "skipped"].includes(i.migrate?.state);
let timer;

// Teammates: people who can sign in to this site's bar. Inviting returns a single-use join link to send them.
const team = (i) => `<form class="team"><label for="tm-${esc(i.id)}">Teammates</label>${(i.team ?? []).map((e) => `<div class="meta">${esc(e)} <button type="button" class="icon" data-email="${esc(e)}" title="Remove ${esc(e)}" aria-label="Remove ${esc(e)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`).join("")}<div class="row"><input id="tm-${esc(i.id)}" type="email" placeholder="name@example.com" autocomplete="off" autocapitalize="off" spellcheck="false" required><button class="btn ghost">Invite</button></div></form>`;

// Cloudflare Pages hosting (spec #13): where the site is served, its previews and sandboxes.
function hosting(i, me) {
  const p = i.pages ?? {};
  if (p.state === "live") return domain(i);
  if (p.state === "setting up") return `<div class="meta">Cloudflare Pages: ${esc(p.detail || "setting up")}…</div>`;
  const err = p.state === "error" ? `<p class="err">${esc(p.error)}</p>${p.permsUrl ? `<div class="row"><a class="btn ghost" href="${esc(p.permsUrl)}" target="_blank" rel="noopener">Review permissions on GitHub</a></div>` : ""}` : "";
  return me.cloudflare ? `${err}<div class="meta">Not on Cloudflare Pages yet.</div>` : "";
}
// Claude: its own Add custom connector dialog with our /mcp filled in, or (once connected) a new chat.
const claudeBtn = (me) => me.claude
  ? `<a class="btn ghost round" title="Manage in Claude" aria-label="Manage in Claude" href="https://claude.ai/new?q=${encodeURIComponent("Let's work on my Agent Keyboard sites")}" target="_blank" rel="noopener">${ICON.claude}</a>`
  : `<a class="btn ghost round" title="Connect to Claude" aria-label="Connect to Claude" href="https://claude.ai/customize/connectors?modal=add-custom-connector&amp;connectorName=Agent%20Keyboard&amp;connectorUrl=${encodeURIComponent("https://agentkeyboard.com/mcp")}" target="_blank" rel="noopener">${ICON.claude}</a>`;
// Icons for Restart, the account menu and the header actions.
const ico = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  restart: ico('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
  add: ico('<path d="M12 5v14M5 12h14"/>'),
  claude: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>`,
  del: ico('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>'),
  out: ico('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>'),
};
// The disconnect icon that removes a custom domain.
const unlink = (host) => `<button class="icon" data-a="domain-remove" title="Disconnect ${esc(host)}" aria-label="Disconnect ${esc(host)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18.84 12.25 1.72-1.71a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5 5 0 0 0 7.07 7.07l1.71-1.71"/><path d="M8 2v3M2 8h3M16 19v3M19 16h3"/></svg></button>`;
// Custom domain (spec #13 M4): add one, then what to do until Pages says it's active.
function domain(i) {
  const d = i.customDomain, sub = i.pages.sub, link = (h) => `<a href="https://${esc(h)}" target="_blank" rel="noopener">${esc(h)}</a>`;
  if (!d) return `<form class="dom"><label for="dom-${esc(i.id)}">Your domain (optional)</label><div class="row"><input id="dom-${esc(i.id)}" placeholder="www.example.com" autocomplete="off" autocapitalize="off" spellcheck="false" required><button class="btn ghost">Add domain</button></div></form>`;
  const rm = unlink(d.host);
  const err = d.error ? `<p class="err">${esc(d.error)}</p>` : "";
  // Active: the "site" link above shows it, with this icon; staged sites link the preview there instead.
  if (d.status === "active") return err;
  let how;
  if (d.zone?.status === "active") how = `We pointed ${esc(d.host)} at your Pages site in your Cloudflare DNS. Cloudflare is issuing its certificate, usually a few minutes.`;
  else if (d.zone) how = `${esc(d.host)} is in your Cloudflare account but not active yet. At your registrar, set its nameservers to <b>${d.zone.ns.map(esc).join("</b> and <b>")}</b>. That can take a few hours to take effect.`;
  else if (d.apex) how = `A root domain needs its DNS on Cloudflare (free). <a href="https://dash.cloudflare.com/?to=/:account/add-site" target="_blank" rel="noopener">Add ${esc(d.host)} to Cloudflare</a>, then switch its nameservers at your registrar to the two Cloudflare shows. We point it at your site as soon as it appears. Or use a subdomain like www.${esc(d.host)} instead.`;
  else how = `At your DNS provider, add this record:</div><pre>CNAME  ${esc(d.host)}  →  ${esc(sub)}</pre><div class="meta">${d.now === sub ? "✓ Found it." : `✗ Not there yet${d.now ? ` (it points to ${esc(d.now)})` : ""}.`} Then Cloudflare issues the certificate.`;
  return `<div class="meta"><b>${esc(d.host)}</b> ${rm} · ${how} We check every 30 seconds.</div>${err}`;
}
// Email from the site's own domain (spec #17): a switch in Advanced once the custom domain is active, its status under it.
// Resend is connected once for every site (like Cloudflare): turning the first one on shows the guided steps.
function mail(i, me) {
  const m = i.mail, host = i.customDomain?.host.replace(/^www\./, "") ?? m.domain;
  const status = !m ? ""
    : m.status === "setting up" ? `<div class="meta">${esc(m.detail || "setting up")}…</div>`
    : m.status === "active" ? `<div class="meta">Sending from <b>${esc(m.from)}</b> ✓</div>`
    : m.status === "verifying" ? `<div class="meta">Resend is verifying <b>${esc(m.domain)}</b>. ${m.records ? `Add these records at your DNS provider:</div><pre>${m.records.map((r) => `${esc(r.type)}  ${esc(r.name)}  ${r.priority != null ? `${esc(r.priority)} ` : ""}${esc(r.content)}`).join("\n")}</pre><div class="meta">` : "We added its DNS records in Cloudflare; this usually takes a few minutes. "}Emails send from <b>${esc(m.from)}</b> once it's verified.</div>`
    : `<p class="err">${keyLink(m.error)}</p>`;
  return `<div class="meta"><label class="auto perm" title="The bar emails teammates you @mention, and this site's agent can send email for the site (a contact form, say).">Allow it to send email from ${esc(host)}<button class="switch" role="switch" aria-checked="${!!m && m.status !== "error"}" data-a="email-toggle" data-set="${!!m}"${m?.status === "setting up" ? " disabled" : ""}></button></label></div>${status}<div class="rsslot"></div>`;
}
const usd = (micro) => (Math.max(0, micro) / 1e6).toFixed(2);
// Resend's key errors name resend.com/api-keys: make it a link.
const keyLink = (s) => esc(s).replace("resend.com/api-keys", `<a href="https://resend.com/api-keys" target="_blank" rel="noopener">resend.com/api-keys</a>`);
// Connect Resend: the same guided steps as Cloudflare. Resend has no pre-filled key form, so step 2 spells it out.
function rsForm(id) {
  return `<p class="small">1. Open Resend and sign up (free) or sign in.</p>
    <div class="row"><a class="btn ghost" href="https://resend.com/api-keys" target="_blank" rel="noopener">Open Resend</a></div>
    <p class="small">2. Under <b>API Keys</b>, click <b>Create API key</b>, name it <b>Agent Keyboard</b>, set Permission to <b>Full access</b>, then <b>Add</b>. Copy the key and paste it here.</p>
    <form class="rsf"><label for="rsk-${esc(id)}">Resend API key</label><div class="row"><input id="rsk-${esc(id)}" type="password" placeholder="re_…" autocomplete="off" spellcheck="false" required><button class="btn ghost">Connect</button></div></form>
    <p class="small">Connect once for all your sites. We keep the key encrypted to add each site's domain and its DNS records; each site only gets a key that can send from its own domain. Revoke it any time on Resend.</p>`;
}
function cfForm(me) {
  return `<div class="card" id="cf"><h2>Connect Cloudflare</h2>${me.cloudflare ? "" : `<p>Your sites are hosted on Cloudflare Pages in your own account: fast, a preview for every change, sandboxes, and your own domain. Connect it once for all of them.</p>`}
    <p>1. Open Cloudflare's token page, already filled in for Agent Keyboard (Pages and DNS on your account). New to Cloudflare? Sign up there first; it's free.</p>
    <div class="row"><a class="btn ghost" href="${esc(me.cloudflareTokenUrl)}" target="_blank" rel="noopener">Open Cloudflare</a></div>
    <p>2. Scroll down, click <b>Continue to summary</b>, then <b>Create token</b>. Copy the token and paste it here.</p>
    <form id="cff"><label for="cft">Cloudflare token</label><input id="cft" type="password" autocomplete="off" spellcheck="false" required>
    <div class="row"><button class="btn">Connect</button>${me.cloudflare ? `<button class="btn ghost" type="button" id="cfx">Cancel</button>` : ""}</div></form>
    <p class="small">Your token goes into your repo's GitHub Actions secrets, where the deploy workflow uses it, and is kept encrypted here to set up your other sites. Revoke it any time on Cloudflare's token page.</p></div>`;
}

// Reconnect Claude: its own slot outside #app (re-renders would wipe it); polls the server's background switch.
let clTimer;
async function claudeSwitch(start) {
  clearTimeout(clTimer);
  const slot = document.getElementById("clslot");
  let st;
  try { st = await api("claude/switch", start ? {} : undefined); } catch (e) { st = { step: "error", error: e.message }; }
  const card = (body) => `<div class="card"><h2>Reconnect Claude</h2>${body}</div>`;
  const cancel = `<div class="row"><button class="btn ghost" type="button" id="clx">Close</button></div>`;
  if (st.step === "starting") slot.innerHTML = card(`<p>Getting a sign-in link…</p>`);
  else if (st.step === "code") {
    if (slot.querySelector("#clf")) return;
    slot.innerHTML = card(`<p>Sign in to claude.ai (with another account if you want to switch), then paste the code it shows. Each site restarts once, which stops any job running on it.</p>
      <a class="btn" href="${esc(st.url)}" target="_blank" rel="noopener">Sign in to Claude</a>
      <form id="clf"><label for="clc">Code from Claude</label><input id="clc" type="password" autocomplete="off" spellcheck="false" required><div class="row"><button class="btn">Reconnect</button><button class="btn ghost" type="button" id="clx">Cancel</button></div></form>`);
    slot.querySelector("#clf").onsubmit = (e) => {
      e.preventDefault();
      api("claude/switch", { code: slot.querySelector("#clc").value }).then(() => claudeSwitch(), (err) => { slot.querySelector(".err")?.remove(); slot.querySelector("#clf").insertAdjacentHTML("beforeend", `<p class="err">${esc(err.message)}</p>`); });
    };
  } else if (st.step === "switching") slot.innerHTML = card(`<p>Reconnecting your sites to Claude…</p>`);
  else if (st.step === "done") slot.innerHTML = card(`<p>Done. Your sites are reconnected to Claude.</p>${st.failed?.length ? `<p class="err">Couldn&apos;t reconnect ${esc(st.failed.join(", "))}: they still use the old connection. Try again.</p>` : ""}${cancel}`);
  else if (st.step === "error") slot.innerHTML = card(`<p class="err">${esc(st.error)}</p>${cancel}`);
  else return (slot.innerHTML = "");
  slot.querySelector("#clx")?.addEventListener("click", () => { clearTimeout(clTimer); slot.innerHTML = ""; });
  if (start) slot.scrollIntoView({ behavior: "smooth" });
  if (["starting", "code", "switching"].includes(st.step)) clTimer = setTimeout(() => claudeSwitch(), 2000);
}

async function render(note) {
  const me = await api("me").catch(() => ({}));
  if (!me.signedIn) return location.replace("/signin");
  listen(me.events);
  document.getElementById("who").innerHTML = `<details class="acct-menu"><summary aria-label="Account: ${esc(me.login)}"><span aria-hidden="true">${esc(me.login.slice(0, 1).toUpperCase())}</span><img src="https://github.com/${encodeURIComponent(me.login)}.png?size=64" alt="" onerror="this.remove()"></summary><div><span>Signed in as ${esc(me.login)}</span><a href="/start">${ICON.add}Add a site</a><button type="button" id="out">${ICON.out}Sign out</button><button type="button" id="del" aria-disabled="true" title="Delete all your sites first, then you can delete your account.">${ICON.del}Delete account</button></div></details>`;
  document.getElementById("out").onclick = () => api("logout", {}).then(() => location.reload());
  document.getElementById("del").onclick = () => alert("Delete all your sites first, then you can delete your account.");
  document.getElementById("acts").innerHTML = `${claudeBtn(me)}<a class="btn round" href="/start" title="Add a site" aria-label="Add a site">${ICON.add}</a>`;
  let list;
  let latest;
  try { ({ instances: list, latest } = await api("instances")); } catch (e) { $app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  if (!list.length) return location.replace("/start");
  // The card's title is the site's address: the custom domain once active, else Pages, else the repo's own domain.
  const host = (i) => (i.pages?.state === "live" ? (i.customDomain?.status === "active" ? i.customDomain.host : i.pages.live) : i.starter ? i.url : i.domain).replace("https://", "");
  $app.innerHTML = (note ? `<p class="note">${esc(note)}</p>` : "") + (me.cloudflare ? "" : cfForm(me)) + list.map((i) => {
    const behind = latest ? i.version !== latest : null, bad = !["running", "warm", "cold"].includes(i.status);
    return `
    <div class="card inst" data-id="${esc(i.id)}" data-adv="${esc(`${i.id}@${i.createdAt}`)}">
      <div class="head"><h2>${bad ? `<span class="dot bad" title="${esc(i.status)}"></span>` : ""}<a href="/cloud/open/${esc(i.id)}" target="_blank" rel="noopener" title="Opens signed in to the bar">${esc(host(i))}</a>${i.pages?.state === "live" && i.customDomain?.status === "active" ? ` ${unlink(i.customDomain.host)}` : ""}</h2></div>
      <div class="meta"><a href="https://github.com/${esc(i.repo)}" target="_blank" rel="noopener">${esc(i.repo)}</a></div>
      <div class="meta upd"><span>${behind === null ? "" : behind ? `Agent Keyboard update available · <button class="link" data-a="update">Update now</button>` : "Agent Keyboard is up to date"}</span><label class="auto" title="Installs each new Agent Keyboard release when no job is running">Auto-update<button class="switch" role="switch" aria-checked="${i.autoUpdate !== false}" data-a="autoupdate" aria-label="Auto-update"></button></label></div>
      ${i.starter || i.tagPath || held(i) ? "" : `<pre>${esc(i.tag)}</pre>`}
      ${moved(i)}
      ${hosting(i, me)}
      ${i.status === "reconnect Fly" ? `<p class="err">Our access to your Fly account expired or was revoked. Delete and set up again to reconnect.</p>` : ""}
      <div class="row actions">${!me.cloudflare || i.pages?.state === "live" || i.pages?.state === "setting up" ? "" : `<button class="btn ghost" data-a="pages">${i.pages?.state === "error" ? "Retry Cloudflare Pages" : "Host on Cloudflare Pages"}</button>`}${i.starter || i.tagPath || held(i) ? "" : `<button class="btn ghost" data-a="tag" title="Commits the tag to your repo's index.html">Add the tag for me</button>`}</div>
      <div class="foot"><details class="more"><summary>Advanced</summary><div class="meta">Sprite <b>${esc(i.id)}</b> · ${esc(i.status)} · version ${esc(i.version ?? i.ref)} · since ${esc(i.createdAt.slice(0, 10))}${i.pages?.state === "live" ? " · Cloudflare Pages · sandboxes on" : ""}${i.tagPath ? ` · bar in ${esc(i.tagPath)}` : ""}</div>
        <div class="meta"><label class="auto perm" title="It can read your other sites' conversations and start one with their agents to ask for changes. Only on your messages, not teammates'.">Allow this agent to talk with your other sites' agents<button class="switch" role="switch" aria-checked="${!!i.mcp && i.mcp.talk !== false}" data-a="mcp-talk"></button></label></div>
        <div class="meta"><label class="auto perm" title="Restart, update or delete any of your sites, this one included, and manage their domains and teammates. It confirms destructive steps with you first.">Allow it to manage your Agent Keyboard sites, this one too<button class="switch" role="switch" aria-checked="${!!i.mcp?.manage}" data-a="mcp-manage"></button></label></div>${i.mail || (i.pages?.state === "live" && i.customDomain?.status === "active") ? mail(i, me) : ""}${team(i)}</details><div class="tools"><button class="btn ghost round" data-a="restart" title="Restart (only needed if the bar is stuck)" aria-label="Restart">${ICON.restart}</button><button class="btn ghost round danger" data-a="delete" title="Delete site" aria-label="Delete site"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></button></div><a class="btn primary" href="/cloud/open/${esc(i.id)}" target="_blank" rel="noopener">Open site</a></div>
    </div>`;
  }).join("") + (list.length ? `<p class="small hint">Bar not showing? Open from here to enable.</p>` : "") + `${me.cloudflare ? `<p class="small acct">Cloudflare: connected (${esc(me.cloudflare)})<span><a href="#" id="cfre">Use a different token</a> · <a href="#" id="cfx">Disconnect</a></span></p>` : ""}${me.resend ? `<p class="small acct">Resend: connected (${esc(me.resend)})<span><a href="#" id="rsre">Use a different key</a> · <a href="#" id="rsx-acct">Disconnect</a></span></p>` : ""}${me.billing?.ours ? `<p class="small acct">Claude: Agent Keyboard's, pay as you go ($${usd(me.billing.credit)} credit · $${usd(me.billing.month)} used this month)<span>Top up ${me.billing.topups.map((n) => `<a href="#" class="topup" data-usd="${n}">$${n}</a>`).join(" ")} · <a href="#" id="clre">Switch to my Claude</a></span></p>`
      : me.claudeAccount ? `<p class="small acct">Claude: connected<span><a href="#" id="clre">Reconnect Claude</a>${me.billing ? ` · <a href="#" id="clours" title="Pay as you go on our Claude: no subscription needed">Use Agent Keyboard's Claude</a>` : ""}</span></p>` : ""}<div id="amslot"></div><div id="chatslot"></div><div id="cfslot"></div>`;
  amRow();
  // Spec 31: anymcp agents turned on with this setup.
  if (me.anymcp) api("anymcp").then(({ agents }) => {
    document.getElementById("amslot").innerHTML = agents.map((a) => `<p class="small acct">anymcp: ${esc(a.app)} on${a.stale ? " (still on your previous Claude: switch it from its bar)" : ""}<span><a href="#" class="amoff" data-sprite="${esc(a.sprite)}" data-app="${esc(a.app)}">Turn off</a></span></p>`).join("");
    document.querySelectorAll(".amoff").forEach((x) => x.addEventListener("click", (e) => {
      e.preventDefault();
      if (confirm(`Turn off anymcp for ${x.dataset.app}? This deletes its Sprite from your Fly account.`)) api("anymcp/off", { sprite: x.dataset.sprite }).then(() => render(), (err) => render(err.message));
    }));
  }, () => {});
  for (const id of advanced()) $app.querySelector(`.inst[data-adv="${CSS.escape(id)}"] details.more`)?.setAttribute("open", "");
  clearTimeout(timer);
  if (list.some((i) => i.pages?.state === "setting up" || i.mail?.status === "setting up")) timer = setTimeout(() => render(note), 3000);
  else if (list.some((i) => i.customDomain?.status === "pending")) timer = setTimeout(() => render(note), 30e3);
  $app.querySelectorAll("form.dom").forEach((f) => (f.onsubmit = async (e) => {
    e.preventDefault();
    const id = f.closest(".inst").dataset.id, btn = f.querySelector("button");
    btn.disabled = true; btn.textContent = "Adding…";
    try { await api(`instances/${id}/domain`, { host: f.querySelector("input").value }); render(); }
    catch (err) { btn.disabled = false; btn.textContent = "Add domain"; f.querySelector(".err")?.remove(); f.insertAdjacentHTML("beforeend", `<p class="err">${esc(err.message)}</p>`); }
  }));
  // Connecting Resend from a site's Advanced also sets up that site's email.
  const rsWire = () => $app.querySelectorAll("form.rsf").forEach((f) => (f.onsubmit = async (e) => {
    e.preventDefault();
    const id = f.closest(".inst")?.dataset.id, btn = f.querySelector("button");
    btn.disabled = true; btn.textContent = "Connecting…";
    try { await api("resend", { key: f.querySelector("input").value }); if (id) await api(`instances/${id}/email`, {}); render(id ? "Resend connected. Setting up email…" : "Resend connected."); }
    catch (err) { btn.disabled = false; btn.textContent = "Connect"; f.querySelector(".err")?.remove(); f.insertAdjacentHTML("beforeend", `<p class="err">${keyLink(err.message)}</p>`); }
  }));
  rsWire();
  document.getElementById("rsre")?.addEventListener("click", (e) => {
    e.preventDefault();
    const slot = document.getElementById("cfslot");
    slot.innerHTML = `<div class="card"><h2>Connect Resend</h2>${rsForm("acct")}<div class="row"><button class="btn ghost" type="button" id="rsx">Cancel</button></div></div>`;
    slot.scrollIntoView({ behavior: "smooth" });
    document.getElementById("rsx").onclick = () => (slot.innerHTML = "");
    rsWire();
  });
  $app.querySelectorAll("form.team").forEach((f) => {
    const id = f.closest(".inst").dataset.id, btn = f.querySelector("button:not([data-email])");
    const fail = (err) => { f.querySelector(".err")?.remove(); f.insertAdjacentHTML("beforeend", `<p class="err">${esc(err.message)}</p>`); };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const email = f.querySelector("input").value;
      btn.disabled = true; btn.textContent = "Inviting…";
      try {
        const { link } = await api(`instances/${id}/invite`, { email });
        await render();
        $app.querySelector(`.inst[data-id="${CSS.escape(id)}"] form.team`)?.insertAdjacentHTML("beforeend", `<p class="small">Send ${esc(email)} this link. It signs them in to the bar once, on one device, within 7 days. To sign them in somewhere else, invite them again.</p><pre>${esc(link)}</pre><div class="row"><button type="button" class="btn ghost copy">Copy link</button></div>`);
        const c = $app.querySelector(`.inst[data-id="${CSS.escape(id)}"] .copy`);
        if (c) c.onclick = () => navigator.clipboard.writeText(link).then(() => (c.textContent = "Copied"), () => {});
      } catch (err) { btn.disabled = false; btn.textContent = "Invite"; fail(err); }
    };
    f.querySelectorAll("button[data-email]").forEach((x) => (x.onclick = async () => {
      if (!confirm(`Remove ${x.dataset.email}? They can no longer use the bar on this site.`)) return;
      x.disabled = true;
      try { await api(`instances/${id}/uninvite`, { email: x.dataset.email }); render(`Removed ${x.dataset.email}.`); }
      catch (err) { x.disabled = false; fail(err); }
    }));
  });
  // Pasting a token connects Cloudflare, then (if a site asked) hosts that site on Pages.
  // Connecting Cloudflare (once, for every site) hosts each site that isn't on Pages yet.
  const wire = () => {
    document.getElementById("cff").onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true; btn.textContent = "Checking…";
      try {
        const r = await api("cloudflare", { token: document.getElementById("cft").value });
        render(`Connected Cloudflare (${r.accountName}).`);
      } catch (err) {
        if (err.message === "Sign in with GitHub again") return (location.href = "/cloud/github/login?next=dashboard");
        btn.disabled = false; btn.textContent = "Connect";
        document.querySelector("#cf .err")?.remove();
        e.target.insertAdjacentHTML("afterend", `<p class="err">${esc(err.message)}</p>`);
      }
    };
  };
  if (!me.cloudflare) wire();
  const disconnect = (id, path, msg) => document.getElementById(id)?.addEventListener("click", (e) => {
    e.preventDefault();
    if (confirm(msg)) api(path, {}).then(() => render(), (err) => render(err.message));
  });
  disconnect("cfx", "cloudflare/remove", "Disconnect Cloudflare? We delete our copy of your token. Sites already on Cloudflare Pages keep deploying with the copy in each repo's GitHub secrets; revoke the token on Cloudflare to stop those too.");
  disconnect("rsx-acct", "resend/remove", "Disconnect Resend? We delete our copy of your key. Each site keeps its own sending-only key; delete those on Resend to stop its email.");
  // Spec 27: switch every site to Agent Keyboard's Claude (the same progress card as Reconnect), and top up on Stripe.
  document.getElementById("clours")?.addEventListener("click", async (e) => {
    e.preventDefault();
    if (!confirm(`Switch all your sites to Agent Keyboard's Claude? You pay as you go from prepaid credit${me.billing.free ? ` ($${me.billing.free / 1e6} free to start)` : ""}. Each site restarts once, which stops any job running on it. Switch back any time.`)) return;
    try { await api("claude/ours", {}); claudeSwitch(); } catch (err) { alert(err.message); }
  });
  document.querySelectorAll(".topup").forEach((a) => a.addEventListener("click", async (e) => {
    e.preventDefault();
    try { location.href = (await api("billing/topup", { usd: Number(a.dataset.usd) })).url; } catch (err) { alert(err.message); }
  }));
  document.getElementById("clre")?.addEventListener("click", (e) => {
    e.preventDefault();
    claudeSwitch(true);
  });
  document.getElementById("cfre")?.addEventListener("click", (e) => {
    e.preventDefault();
    const slot = document.getElementById("cfslot");
    slot.innerHTML = cfForm(me);
    slot.scrollIntoView({ behavior: "smooth" });
    document.getElementById("cfx").onclick = () => (slot.innerHTML = "");
    wire();
  });
  $app.querySelectorAll("button[data-a]").forEach((b) => (b.onclick = async () => {
    const id = b.closest(".inst").dataset.id, a = b.dataset.a;
    if (a === "domain-remove" && !confirm(`Remove this domain from your Pages site? Its DNS record stays; delete it yourself if you no longer need it.${b.closest(".inst").querySelector("[data-a=email-toggle][aria-checked=true]") ? " Email from this domain stops too." : ""}`)) return;
    // Email: on sets it up (first connecting Resend, with the guided steps); off deletes the site's sending key.
    if (a === "email-toggle") {
      const on = b.getAttribute("aria-checked") !== "true", slot = b.closest(".inst").querySelector(".rsslot");
      b.setAttribute("aria-checked", on);
      if (!me.resend) { slot.innerHTML = on ? rsForm(id) : ""; rsWire(); if (on || b.dataset.set !== "true") return; } // off with nothing set up (or a failed try to clear)
      b.disabled = true;
      return api(`instances/${id}/${on ? "email" : "email-remove"}`, {}).then(() => render(), (e) => render(e.message));
    }
    // The switch flips in place (no note line, no disabled row); the re-render only adds or drops the Update button.
    if (a === "autoupdate") {
      b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true");
      return api(`instances/${id}/autoupdate`, {}).then(() => render(), (e) => render(e.message));
    }
    if (a === "mcp-talk" || a === "mcp-manage") {
      b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true");
      const card = b.closest(".inst"), is = (x) => card.querySelector(`[data-a="${x}"]`).getAttribute("aria-checked") === "true";
      const talk = is("mcp-talk"), manage = is("mcp-manage");
      card.querySelectorAll("[data-a^=mcp-]").forEach((x) => (x.disabled = true));
      return api(`instances/${id}/mcp`, { talk, manage }).then(() => render(), (e) => render(e.message));
    }
    const inst = list.find((x) => x.id === id), pg = inst?.pages;
    if (a === "delete" && !confirm(`Delete ${id}? This removes the Sprite and its Claude connector from your Fly account${pg?.project && !pg.git ? ", and the Cloudflare deploy workflow, secret and variables from your repo" : ""}${inst?.mail?.keyId ? ", and the site's Resend sending key" : ""}. Your repo and its code stay.`)) return;
    const offline = a === "delete" && !!pg?.created && confirm(`Also take the website offline? OK deletes its Cloudflare Pages project ${pg.project}${inst.customDomain ? ` (and ${inst.customDomain.host} stops serving it)` : ""}. Cancel keeps the site up as it is now.`);
    (b.closest(".row")?.querySelectorAll("button") ?? [b]).forEach((x) => (x.disabled = true));
    b.classList.remove("round"); // the progress label replaces the icon
    b.textContent = LABEL[a];
    try { const r = await api(`instances/${id}/${a}`, offline ? { offline } : {}); render(a === "delete" ? `Deleted ${id}.${r.warning ? ` ${r.warning}` : ""}` : a === "domain-remove" ? "Removed the domain." : a === "email-remove" ? "Email is off." : a === "email" ? "Setting up email…" : a === "tag" ? `Added the tag to ${r.path}. Your host redeploys from that commit.` : a === "import-skip" ? (r.path ? "Starting fresh. The bar on your site now points here; your host redeploys in a minute." : "Starting fresh.") : `${id}: ${a} done.`); }
    catch (e) { if (e.message === "Sign in with GitHub again") location.href = "/cloud/github/login?next=dashboard"; else render(e.message); }
  }));
}
render();
// Server push: the stream sends a revision that moves whenever this user's sites or connections change
// (Claude connected, a site updated, a domain went live…). Re-render on a change, unless they're typing in a field.
// The account menu closes on a tap outside it or Escape.
addEventListener("click", (e) => document.querySelectorAll(".acct-menu[open]").forEach((d) => !d.contains(e.target) && d.removeAttribute("open")));
addEventListener("keydown", (e) => e.key === "Escape" && document.querySelectorAll(".acct-menu[open]").forEach((d) => d.removeAttribute("open")));
if (matchMedia("(hover: hover)").matches) { // mouse: open on hover; touch keeps tap-to-open
  addEventListener("mouseover", (e) => document.querySelectorAll(".acct-menu").forEach((d) => (d.open = d.contains(e.target))));
  addEventListener("click", (e) => e.detail && e.target.closest(".acct-menu summary") && e.preventDefault());
}
// Which cards have Advanced open survives re-renders and reloads.
const advanced = () => { try { return JSON.parse(localStorage.getItem("ak-advanced")) ?? []; } catch { return []; } };
$app.addEventListener("toggle", (e) => {
  const id = e.target.matches?.("details.more") && e.target.closest(".inst")?.dataset.adv; // per site and creation, so a re-added site starts collapsed
  if (id) localStorage.setItem("ak-advanced", JSON.stringify([...advanced().filter((x) => x !== id), ...(e.target.open ? [id] : [])]));
}, true);
let rev, events;
function listen(url) {
  if (events || !url) return;
  events = new EventSource(url);
  events.onmessage = (e) => {
    if (rev && e.data !== rev && !document.activeElement?.matches("input")) render();
    rev = e.data;
  };
  // refused (the 24 h link expired, or the server was mid-deploy): get a fresh link and reconnect
  events.onerror = () => { if (events.readyState === EventSource.CLOSED) { events = null; setTimeout(render, 5000); } };
}
</script>
<script>
// Spec 32: anymcp.chat's agent, to manage these sites by chatting. Its bar knows the user from a short JWT of this
// session; Turn on gives it an MCP token for /mcp, revoked once the agent is off.
let amJwt, amOn = null, amStarting = false;
window.anymcp = { token: async () => {
  if (!amJwt || amJwt.exp < Date.now() + 60e3) { const r = await fetch("/cloud/anymcp/jwt"); amJwt = r.ok ? { t: (await r.json()).token, exp: Date.now() + 600e3 } : null; }
  return amJwt?.t ?? null;
},
// We are the setup provider, so the bar can hand us the code here instead of opening our /anymcp page in a tab.
setup: (x) => api("anymcp/enable", { code: x?.code ?? x }) };
function amRow() {
  const el = document.getElementById("chatslot");
  if (!el || amOn === null) return;
  el.innerHTML = `<p class="small acct" title="An agent in a chat bar on this page that lists, sets up and manages your sites and asks their agents for changes. It runs on a Sprite in your Fly account with your Claude.">Chat agent: ${amOn ? "on" : "off"}<span><a href="#" id="amtog">${amOn ? "Turn off" : "Turn on"}</a></span></p>`;
  document.getElementById("amtog").onclick = async (e) => {
    e.preventDefault();
    try {
      if (amOn) { if (confirm("Turn off the chat agent? This deletes its Sprite, its chat and its Claude sign-in.")) await anymcp.disable(); return; }
      anymcp.offer(true); // undoes the bar's "Don't show again"
      await amEnable();
    } catch (err) { amStarting = false; alert(err.message); }
  };
}
// Turn on, from this row or the bar's invite ("Chat with your sites"): a fresh token replaces any old one.
async function amEnable() {
  amStarting = true;
  await anymcp.enable((await api("anymcp/token", {})).token);
}
addEventListener("anymcp:enable-request", () => amEnable().catch((err) => { amStarting = false; alert(err.message); }));
addEventListener("anymcp:status", (e) => {
  const { on, setup } = e.detail;
  if (on || setup) amStarting = false;
  else if (!amStarting && amOn !== false) api("anymcp/token/revoke", {}).catch(() => {}); // once per turn-off, not every check
  if (amOn !== on) { amOn = on; amRow(); }
});
addEventListener("anymcp:changed", () => render());
</script>
<script src="https://anymcp.chat/bar.js" data-offer="Chat with your sites" data-offer-href="/dashboard" data-logo="https://agentkeyboard.com/typewriter-mark.png" data-theme="dark" data-accent="#ffb86b" defer></script>
<script src="https://agent-keyboard.fly.dev/widget.js" data-site="halo" data-accent="#ffb86b" data-theme="dark" data-summon="signed-out" defer></script>
