<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Agent Keyboard</title>
<link rel="icon" href="https://agentkeyboard.com/favicon.png">
<meta name="description" content="Your own Fly Sprite running Claude Code, editing your app from a prompt bar on the live site. Sign in with GitHub, link Fly, add one script tag.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Agent Keyboard">
<meta property="og:title" content="Agent Keyboard Cloud">
<meta property="og:description" content="Your own Fly Sprite running Claude Code, editing your app from a prompt bar on the live site. Sign in with GitHub, link Fly, add one script tag.">
<meta property="og:url" content="https://agentkeyboard.com/start">
<meta property="og:image" content="https://agentkeyboard.com/cloud-og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A glowing prompt bar between a pixel-art typewriter and a website, on a purple sky with balloons">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://agentkeyboard.com/cloud-og.jpg?v=2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cloud/cloud.css">
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="https://agentkeyboard.com"><img src="https://agentkeyboard.com/typewriter-mark.png" alt=""><b>Agent Keyboard</b></a></div>
  <h1>Sign in to Agent Keyboard</h1>
  <div class="card"><p>Sign in with GitHub to set up Agent Keyboard or manage your instances.</p><a class="btn" id="go" href="/cloud/github/login?next=dashboard">Sign in with GitHub</a></div>
</div>
<script>
// ?next=start comes from /start: GitHub then walks a new user through installing the app.
const n = new URLSearchParams(location.search).get("next") ?? "", next = n === "start" || n === "/anymcp" ? n : "dashboard";
document.getElementById("go").href = "/cloud/github/login?next=" + encodeURIComponent(next);
if (next === "start") document.getElementById("go").insertAdjacentHTML("beforebegin", '<p class="small">GitHub then asks where to install Agent Keyboard. If your site\'s repo is in an organization, pick that organization. You can add more accounts later.</p>');
</script>
<script src="https://agent-keyboard.fly.dev/widget.js" data-site="halo" data-accent="rainbow" data-theme="dark" data-summon="signed-out" defer></script>
</body>
</html>
